<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages is a static host with no server-side rewrites, so a direct
      // load of a client-side route (e.g. /library) 404s. This redirects that
      // 404 back to index.html with the original path encoded in the query
      // string; index.html then restores it via history.replaceState.
      var pathSegmentsToKeep = 1; // keep the "/<repo-name>" segment

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replaceAll('&', '~and~') +
          (l.search ? '&' + l.search.slice(1).replaceAll('&', '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
